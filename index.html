<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولّد رمز QR للفواتير الإلكترونية — ZATCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --paper:#F1F4F2;
    --ink:#122B26;
    --ink-soft:#5D6E68;
    --teal:#1E5A50;
    --teal-deep:#0C2C27;
    --gold:#A07A2C;
    --line:#DAE1DC;
    --line-strong:#C1CCC5;
    --red:#A23B36;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1000px 500px at 90% -10%, rgba(30,90,80,0.06), transparent 60%),
      radial-gradient(800px 450px at -10% 110%, rgba(160,122,44,0.05), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:48px 20px;
  }

  .brandline{
    display:flex; align-items:center; gap:10px; margin-bottom:24px;
    font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); letter-spacing:1px;
  }
  .brandline .mark{
    width:16px; height:16px; border-radius:4px; background:var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
  }
  .brandline .mark svg{ width:9px; height:9px; }
  .brandline b{ color:var(--ink); font-weight:600; letter-spacing:0.4px; }
  .brandline .sep{ color:var(--line-strong); }

  .wrap{
    width:100%; max-width:920px;
    display:grid; grid-template-columns: 1.15fr 0.85fr; gap:24px; align-items:start;
  }
  @media (max-width: 760px){ .wrap{ grid-template-columns:1fr; } }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow: 0 1px 2px rgba(18,43,38,0.03), 0 14px 32px -16px rgba(18,43,38,0.20);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset-inline:0; top:0; height:3px;
    background:linear-gradient(90deg, var(--teal), var(--gold));
  }
  .form-card{ padding:30px 28px 26px; }

  .group{ padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .group:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }

  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; margin-bottom:7px; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:420px){ .row2{ grid-template-columns:1fr; } }

  input{
    width:100%; font-family:var(--sans); font-size:14.5px; color:var(--ink); font-weight:500;
    background:var(--paper); border:1px solid var(--line-strong); border-radius:10px;
    padding:12px 14px; outline:none; transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type=number]{ font-family:var(--mono); direction:ltr; text-align:right; }
  input:focus{ border-color:var(--teal); background:#fff; box-shadow:0 0 0 3px rgba(30,90,80,0.13); }
  input.invalid{ border-color:var(--red); background:#FBEEEC; }
  input[readonly]{
    color:var(--ink-soft); background:#EAF0EC; cursor:default; font-family:var(--mono);
    direction:ltr; text-align:right; border-style:dashed;
  }

  .qr-card{
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:30px 26px 26px;
  }
  .qr-frame{
    width:100%; max-width:270px; aspect-ratio:1/1; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:#fff; border:1px solid var(--line);
    box-shadow: inset 0 0 0 1px #fff, 0 1px 2px rgba(18,43,38,0.04);
    padding:16px;
  }
  #qrcode{ line-height:0; width:100%; height:100%; }
  #qrcode img, #qrcode canvas{ width:100% !important; height:100% !important; image-rendering:pixelated; border-radius:4px; }
  .qr-empty{ text-align:center; color:var(--ink-soft); font-size:12.5px; line-height:1.7; padding:0 10px; }

  .qr-actions{ display:flex; gap:10px; width:100%; }
  .btn{
    flex:1; height:42px; border-radius:10px; border:1px solid var(--line-strong);
    background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:7px;
    cursor:pointer; transition:border-color .15s, color .15s, transform .1s, box-shadow .15s;
    font-family:var(--sans); font-size:12.5px; font-weight:600;
  }
  .btn:hover{ border-color:var(--teal); color:var(--teal); box-shadow:0 4px 10px -6px rgba(30,90,80,0.4); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn[disabled]:hover{ border-color:var(--line-strong); color:var(--ink); }

/* Loopstack-inspired replacement background */
html,body{background:#000 !important; overflow:hidden;}
body{position:relative; isolation:isolate;}
.loop-bg{position:fixed;inset:0;z-index:-3;background:#000;overflow:hidden;pointer-events:none;}
.loop-bg video{position:absolute;left:0;bottom:0;width:100%;height:90vh;object-fit:cover;transform:scale(1.02);filter:saturate(.95) contrast(1.05);}
.loop-gradient{position:fixed;top:-30vh;left:0;width:100vw;height:auto;z-index:-2;pointer-events:none;}
.loop-shade{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 34%,rgba(0,0,0,.18) 68%,rgba(0,0,0,.42) 100%);}
.brandline{position:relative;z-index:3;color:rgba(255,255,255,.72)!important;}
.brandline b{color:#fff!important}.brandline .sep{color:rgba(255,255,255,.35)!important}
.card{background:rgba(8,10,10,.66)!important;border-color:rgba(255,255,255,.15)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(0,0,0,.34)!important;}
.field label{color:rgba(255,255,255,.72)!important;}
input{background:rgba(255,255,255,.09)!important;color:#fff!important;border-color:rgba(255,255,255,.18)!important;}
input:focus{background:rgba(0,0,0,.5)!important;border-color:#39FF14!important;box-shadow:0 0 0 3px rgba(57,255,20,.12)!important;}
input[readonly]{background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.72)!important;}
.qr-frame{background:#fff!important;border-color:rgba(255,255,255,.2)!important;}
.btn{background:rgba(0,0,0,.68)!important;color:#fff!important;border-color:rgba(255,255,255,.18)!important;}
.btn:hover{background:#fff!important;color:#000!important;border-color:#fff!important;}


/* Responsive mobile / tablet layout */
html{width:100%;min-width:0;overflow-x:hidden;}
html,body{background:#000 !important;}
body{
  width:100%;
  min-width:0;
  min-height:100svh;
  overflow-x:hidden;
  overflow-y:auto;
  justify-content:flex-start;
  padding:clamp(18px,5vh,48px) clamp(12px,4vw,20px) 32px;
}
.wrap{min-width:0;}
.card,.form-card,.qr-card,.field,.row2{min-width:0;}
input,button{max-width:100%;}
.loop-bg,.loop-gradient,.loop-shade{position:fixed;}
.loop-bg video{width:100%;height:100%;min-height:100%;object-fit:cover;}

@media (max-width: 900px){
  body{padding-top:24px;padding-bottom:28px;}
  .brandline{
    width:min(100%,720px);
    justify-content:center;
    flex-wrap:wrap;
    text-align:center;
    gap:7px;
    margin-bottom:16px;
    font-size:11px;
    line-height:1.5;
  }
  .wrap{
    width:min(100%,720px);
    grid-template-columns:1fr;
    gap:16px;
  }
  .form-card{padding:24px 22px 20px;}
  .qr-card{padding:24px 22px 22px;}
  .qr-frame{max-width:320px;}
}

@media (max-width: 600px){
  body{
    padding:14px 10px 22px;
    -webkit-text-size-adjust:100%;
  }
  .brandline{
    margin:2px auto 12px;
    padding:0 4px;
    font-size:10.5px;
    letter-spacing:.35px;
  }
  .brandline .mark{width:18px;height:18px;}
  .wrap{gap:12px;}
  .card{border-radius:14px;}
  .form-card{padding:20px 15px 16px;}
  .qr-card{padding:20px 15px 16px;gap:14px;}
  .group{padding-bottom:14px;margin-bottom:14px;}
  .field{margin-bottom:13px;}
  .field label{font-size:11px;margin-bottom:6px;letter-spacing:.25px;}
  .row2{grid-template-columns:1fr;gap:0;}
  input{
    min-height:46px;
    font-size:16px;
    padding:11px 12px;
    border-radius:10px;
  }
  .qr-frame{
    width:min(100%,300px);
    max-width:none;
    padding:12px;
    border-radius:12px;
  }
  .qr-actions{gap:8px;flex-wrap:wrap;}
  .btn{
    min-width:0;
    min-height:46px;
    height:46px;
    font-size:12px;
    padding:0 10px;
  }
  .loop-bg video{transform:none;filter:saturate(.9) contrast(1.05) brightness(.72);}
  .loop-shade{background:linear-gradient(to bottom,rgba(0,0,0,.68),rgba(0,0,0,.26) 38%,rgba(0,0,0,.38) 100%);}
}

@media (max-width: 360px){
  body{padding-inline:8px;}
  .form-card,.qr-card{padding-left:12px;padding-right:12px;}
  .qr-actions{flex-direction:column;}
  .btn{width:100%;flex:none;}
  .qr-frame{width:min(100%,270px);}
}

@media (min-width: 601px) and (max-width: 900px){
  .row2{grid-template-columns:1fr 1fr;gap:14px;}
  .qr-frame{width:min(100%,320px);}
}

@media (orientation: landscape) and (max-height: 650px) and (max-width: 1000px){
  body{padding-top:12px;padding-bottom:18px;}
  .brandline{margin-bottom:10px;}
  .wrap{width:min(100%,900px);grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:12px;}
  .form-card,.qr-card{padding-top:16px;padding-bottom:14px;}
  .group{padding-bottom:10px;margin-bottom:10px;}
  .field{margin-bottom:9px;}
  input{min-height:42px;padding-top:8px;padding-bottom:8px;}
  .qr-frame{max-width:230px;}
}


/* تمكين التمرير العمودي للصفحة */
html{overflow-x:hidden!important;overflow-y:auto!important;height:auto!important}
body{overflow:visible!important;height:auto!important}

/* ===== Invoice page ===== */
input::placeholder{color:rgba(255,255,255,.4)}
input[type=date],input[type=time]{color-scheme:dark}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);margin-bottom:18px;position:relative;z-index:3;backdrop-filter:blur(12px)}
.tabs a{padding:9px 22px;border-radius:9px;color:rgba(255,255,255,.75);text-decoration:none;font-size:13px;font-weight:600}
.tabs a.on{background:#fff;color:#000}
.inv-wrap{display:none;width:100%;max-width:1240px;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:24px;align-items:start}
body.on-inv .inv-wrap{display:grid}
body.on-inv .wrap{display:none}
@media(max-width:900px){.inv-wrap{grid-template-columns:minmax(0,1fr);gap:16px}}
.fl{display:flex;flex-wrap:wrap;gap:0 14px}
.fl .field{flex:1 1 100%;min-width:0}.fl .field.h{flex:1 1 calc(50% - 7px)}
.gt{font-size:12px;font-weight:700;color:#39FF14;margin:0 0 12px}
.irow{display:grid;grid-template-columns:1fr 2fr .8fr .9fr 1fr auto;gap:6px;margin-bottom:6px}
.irow input[readonly]{font-family:var(--sans);direction:rtl;text-align:right;cursor:default;text-overflow:ellipsis}
.irow input.bad,input.invalid{border-color:#ff5a52!important;background:rgba(255,90,82,.14)!important}
.irow input.bad::placeholder{color:#ff9a94}
#sg{position:fixed;z-index:60;display:none;max-height:272px;overflow:auto;direction:rtl;background:#0b0e0e;border:1px solid rgba(255,255,255,.22);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
#sg .sgi{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.07);color:#fff;font-size:12.5px}
#sg .sgi:last-child{border-bottom:0}
#sg .sgi.on,#sg .sgi:hover{background:rgba(57,255,20,.14)}
#sg .sc{font-family:var(--mono);direction:ltr;color:#39FF14;min-width:64px;text-align:left;flex:none}
#sg .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sg .su{color:rgba(255,255,255,.55);font-size:11px;flex:none}
#sg .se{padding:10px;color:rgba(255,255,255,.6);font-size:12.5px}
.irow input{padding:9px 8px;font-size:13px;min-width:0}
.irow .x{width:34px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px}
@media(max-width:600px){.irow{grid-template-columns:1fr 1fr}.irow input{font-size:16px}.irow .x{width:100%;height:40px}}
.inv-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.inv-fit{width:100%;overflow:hidden}
.sheet{width:794px;min-height:1123px;margin-inline:auto;background:#fff;color:#000;font:13px/1.5 Arial,Helvetica,sans-serif;padding:44px 40px 36px;direction:rtl;transform-origin:top right}
.sheet *{box-sizing:border-box}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.p-head{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.p-seller{flex:1}.p-org{font-size:15px;font-weight:700}.p-plant{font-size:18px;font-weight:700}.p-addr{font-size:12px;font-weight:700}
.p-vat{display:flex;gap:8px;font-weight:700;margin-top:6px}
.p-logo{width:96px;height:88px;flex:none}.p-logo img{width:100%;height:100%;object-fit:contain}
.p-title,.sh{background:#c0c0c0;border:.75px solid #000;text-align:center;font-weight:700}
.p-title{font-size:16px;padding:3px}
.p-meta,.p-cust,.p-bot{border:.75px solid #000;border-top:0}
.p-meta{display:flex;justify-content:space-between;padding:5px 10px;font-weight:700}
.p-cust{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 10px;border-bottom:0}
.big{font-size:15px}
.p-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.p-tbl th,.p-tbl td{border:.75px solid #000;padding:5px 6px;text-align:center;height:26px;overflow-wrap:anywhere}
.p-tbl th{background:#ececec}
.p-tbl td.l{text-align:right}.p-tbl td.n{direction:ltr}
.p-bot{display:flex;gap:12px;padding:10px;align-items:stretch}
.p-qr{width:112px;height:112px;flex:none}
.p-qr img,.p-qr canvas{width:112px!important;height:112px!important;display:block}
.p-qx{width:112px;height:112px;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center;color:#bbb;font-weight:700}
.p-words{flex:1;border:1px dotted #000;padding:8px;text-align:center;font-weight:700}
.p-words div{margin-top:6px;font-weight:400;line-height:1.7}
.p-tot{width:250px;flex:none;border-collapse:collapse}
.p-tot td{border:.75px solid #000;padding:4px 8px;font-weight:700}
.p-tot td:last-child{direction:ltr;text-align:left}
.p-tot .fin td{background:#c0c0c0;font-size:15px}
.p-sign{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px}
.p-sign>div{border:.75px solid #000;margin-inline-start:-.75px}
.p-sign .sh{border:0;border-bottom:.75px solid #000;padding:3px}.p-sign .sb{height:56px}
.p-head{display:block;position:relative;margin-bottom:0}
.p-org{font-size:16px;font-weight:400}
.p-plant{font-size:19px;font-weight:700;margin-top:6px}
.p-addr{font-size:13px;font-weight:700;margin-top:4px}
.p-logo{position:absolute;left:84px;top:10px;width:91px;height:auto;margin:0}
.p-logo img{width:100%;height:auto;display:block}
.p-vat{position:relative;display:block;height:36px;margin-top:12px}
.p-vat>*{position:absolute;top:6px;font-size:14px;font-weight:700;white-space:nowrap}
.p-vat .vl{right:227px}.p-vat .vn{right:381px;font-size:13px}.p-vat .ve{right:515px;font-size:16px}
.p-title{border:0;font-size:16px;padding:4px 3px}
.p-meta{border-top:.75px solid #000}
@media print{
@page{size:A4;margin:0}
html,body{background:#fff!important;height:auto!important;overflow:visible!important}
body{display:block!important;padding:0!important}
body.on-inv>*:not(.inv-wrap){display:none!important}
.inv-form{display:none!important}
.inv-wrap{display:block!important;max-width:none}
.inv-fit{height:auto!important;overflow:visible}
.sheet{transform:none!important;width:210mm;min-height:297mm;margin:0}
.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

<body>
<div class="loop-bg" aria-hidden="true">
  <video autoplay muted loop playsinline preload="auto">
    <source src="https://api.getlayers.ai/storage/v1/object/public/public/assets/loopstack-f8c64439bf/flower.mp4" type="video/mp4">
  </video>
</div>
<img class="loop-gradient" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/loopstack-f8c64439bf/black_gradient.svg" alt="" aria-hidden="true">
<div class="loop-shade" aria-hidden="true"></div>


  <div class="brandline">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M4 12l6 6L20 6"/></svg></span>
    <b>ZATCA</b><span class="sep">·</span><span>مولّد رمز QR للفاتورة الإلكترونية</span>
  </div>

  <nav class="tabs"><a href="#qr" id="tQr" class="on">رمز QR</a><a href="#invoice" id="tInv">الفاتورة</a></nav>
  <div class="wrap">
    <!-- FORM -->
    <section class="card form-card">
      <div class="group">
        <div class="field" id="f-name">
          <label>اسم المورد / الشركة</label>
          <input type="text" id="supplierName" autocomplete="off">
        </div>
        <div class="field" id="f-vat">
          <label>الرقم الضريبي للمورد</label>
          <input type="text" id="vatNumber" maxlength="15" inputmode="numeric" autocomplete="off">
        </div>
      </div>

      <div class="group">
        <div class="row2">
          <div class="field" id="f-date">
            <label>تاريخ الفاتورة</label>
            <input type="date" id="invoiceDate">
          </div>
          <div class="field" id="f-time">
            <label>وقت الفاتورة</label>
            <input type="time" id="invoiceTime" step="1">
          </div>
        </div>
      </div>

      <div class="group">
        <div class="field" id="f-total">
          <label>الإجمالي شامل الضريبة (ر.س)</label>
          <input type="number" id="totalAmount" step="0.01" min="0">
        </div>
      </div>

      <div class="group">
        <div class="row2">
          <div class="field">
            <label>المبلغ قبل الضريبة</label>
            <input type="text" id="subtotalAmount" readonly>
          </div>
          <div class="field">
            <label>ضريبة القيمة المضافة 15%</label>
            <input type="text" id="vatAmount" readonly>
          </div>
        </div>
      </div>
    </section>

    <!-- QR OUTPUT -->
    <section class="card qr-card">
      <div class="qr-frame">
        <div id="qrcode"></div>
        <div class="qr-empty" id="qrEmpty">أكمل البيانات لعرض<br>رمز QR هنا</div>
      </div>
      <div class="qr-actions">
        <button class="btn" id="downloadBtn" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
          تنزيل PNG
        </button>
        <button class="btn" id="copyBtn" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>
          نسخ
        </button>
      </div>
    </section>
  </div>

<div class="inv-wrap">
  <section class="card inv-form form-card" id="invForm"></section>
  <div class="inv-prev"><div class="inv-fit" id="fit"><div class="sheet" id="sheet"></div>
  </div></div>
</div>

<script>
(function(){
  const els = {
    name: document.getElementById('supplierName'),
    vat: document.getElementById('vatNumber'),
    date: document.getElementById('invoiceDate'),
    time: document.getElementById('invoiceTime'),
    total: document.getElementById('totalAmount'),
  };
  const vatAmountEl = document.getElementById('vatAmount');
  const subtotalAmountEl = document.getElementById('subtotalAmount');

  const qrEl = document.getElementById('qrcode');
  const qrEmpty = document.getElementById('qrEmpty');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn = document.getElementById('copyBtn');

  let lastBase64 = '';
  // rendered internally at maximum resolution, scaled down via CSS for crisp/print-quality output
  const QR_RENDER_SIZE = 5000;

  function validateVat(v){
    return /^\d{15}$/.test(v) && v[0] === '3' && v[14] === '3';
  }

  function toUtf8Bytes(str){ return new TextEncoder().encode(str); }

  function tlvBytes(tag, valueStr){
    const valueBytes = toUtf8Bytes(valueStr);
    const bytes = new Uint8Array(2 + valueBytes.length);
    bytes[0] = tag; bytes[1] = valueBytes.length;
    bytes.set(valueBytes, 2);
    return bytes;
  }

  function concatBytes(arrays){
    const total = arrays.reduce((s,a) => s + a.length, 0);
    const out = new Uint8Array(total);
    let offset = 0;
    for (const a of arrays){ out.set(a, offset); offset += a.length; }
    return out;
  }

  function bytesToBase64(bytes){
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return window.btoa(binary);
  }

  function renderQr(base64){
    qrEl.innerHTML = '';
    new QRCode(qrEl, {
      text: base64,
      width: QR_RENDER_SIZE,
      height: QR_RENDER_SIZE,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    qrEmpty.style.display = 'none';
    downloadBtn.disabled = false;
    copyBtn.disabled = false;
  }

  function clearQr(){
    qrEl.innerHTML = '';
    qrEmpty.style.display = 'block';
    downloadBtn.disabled = true;
    copyBtn.disabled = true;
  }

  function update(){
    const nameVal = els.name.value.trim();
    const vatVal = els.vat.value.trim();
    const dateVal = els.date.value;
    const timeVal = els.time.value;
    const totalVal = els.total.value;

    const nameOk = nameVal.length > 0;
    const vatOk = validateVat(vatVal);
    const dateOk = !!dateVal;
    const timeOk = !!timeVal;
    const totalOk = totalVal !== '' && !isNaN(parseFloat(totalVal)) && parseFloat(totalVal) >= 0;

    els.name.classList.toggle('invalid', els.name.value.length > 0 && !nameOk);
    els.vat.classList.toggle('invalid', els.vat.value.length > 0 && !vatOk);
    els.total.classList.toggle('invalid', els.total.value.length > 0 && !totalOk);

    let vatAmount = null, subtotalAmount = null, totalAmount = null;
    if (totalOk){
      totalAmount = parseFloat(totalVal);
      subtotalAmount = totalAmount / 1.15;
      vatAmount = totalAmount - subtotalAmount;
      subtotalAmountEl.value = subtotalAmount.toFixed(2);
      vatAmountEl.value = vatAmount.toFixed(2);
    } else {
      subtotalAmountEl.value = '';
      vatAmountEl.value = '';
    }

    // Keep the exact date/time the user picked — treated as-is, no UTC offset shift,
    // so the timestamp inside the QR never lands on a different day than selected.
    let tsUtc = null;
    if (dateOk && timeOk){
      const timeFull = timeVal.length === 5 ? timeVal + ':00' : timeVal;
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateVal) && /^\d{2}:\d{2}:\d{2}$/.test(timeFull)){
        tsUtc = `${dateVal}T${timeFull}Z`;
      }
    }

    const allOk = nameOk && vatOk && dateOk && timeOk && totalOk && tsUtc;

    if (allOk){
      const bytes = concatBytes([
        tlvBytes(1, nameVal),
        tlvBytes(2, vatVal),
        tlvBytes(3, tsUtc),
        tlvBytes(4, totalAmount.toFixed(2)),
        tlvBytes(5, vatAmount.toFixed(2)),
      ]);
      lastBase64 = bytesToBase64(bytes);
      renderQr(lastBase64);
    } else {
      lastBase64 = '';
      clearQr();
    }
  }

  [els.name, els.vat, els.date, els.time, els.total].forEach(el => {
    el.addEventListener('input', update);
  });

  copyBtn.addEventListener('click', async () => {
    if (!lastBase64) return;
    try { await navigator.clipboard.writeText(lastBase64); } catch(e){}
  });

  downloadBtn.addEventListener('click', () => {
    const canvas = qrEl.querySelector('canvas');
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = 'zatca-qr.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // page always starts empty — no seeded sample data, no persistence across refresh
  update();

SC=[0,['ألف','آلاف','ألفاً','ألفان'],['مليون','ملايين','مليوناً','مليونان'],['مليار','مليارات','ملياراً','ملياران']];
const t3=x=>{const p=[],a=x/100|0,r=x%100;if(a)p.push(H[a]);if(r<20){if(r)p.push(O[r])}else{if(r%10)p.push(O[r%10]);p.push(T[r/10|0])}return p.join(' و')};
function tq(n){if(!n)return'صفر';const g=[];while(n){g.push(n%1000);n=Math.floor(n/1000)}const o=[];for(let i=g.length-1;i>=0;i--){const v=g[i];if(!v)continue;if(!i)o.push(t3(v));else o.push(v==1?SC[i][0]:v==2?SC[i][3]:t3(v)+' '+SC[i][v<=10?1:v<100?2:0])}return o.join(' و')}
const un=(n,w)=>n==1?w[0]:n==2?w[1]:(n>=3&&n<=10?w[2]:w[3]);
function words(v){const r=Math.floor(v+1e-9),h=Math.round((v-r)*100),p=[],R=['ريال واحد','ريالان','ريالات','ريال'],Hh=['هللة واحدة','هللتان','هللات','هللة'];
if(r)p.push(r>2?tq(r)+' '+un(r,R):un(r,R));if(h)p.push(h>2?tq(h)+' '+un(h,Hh):un(h,Hh));
return(p.length?p.join(' و '):'صفر ريال')+' فقط لاغير'}

/* QR (TLV → Base64) */
const enc=new TextEncoder(),tlv=(t,s)=>{const b=enc.encode(s);return[t,b.length,...b]};
function b64(a,b,c,d,e){const x=[...tlv(1,a),...tlv(2,b),...tlv(3,c),...tlv(4,d),...tlv(5,e)];let s='';x.forEach(n=>s+=String.fromCharCode(n));return btoa(s)}

function fit(){const f=$('fit'),w=f.clientWidth;if(!w)return;const s=w/596,e=$('sheet');e.style.transform='scale('+s+')';f.style.height=Math.ceil(e.offsetHeight*s)+'px'}
function calc(){
const v=id=>$(id).value.trim(),S=(id,t)=>{$(id).textContent=t};
S('pNo',v('iNo').replace(/^\d+$/,m=>m.replace(/\B(?=(\d{3})+(?!\d))/g,',')));
S('pDate',v('iDate').replace(/-/g,'/'));
const cv=v('cVat'),cvOk=/^3\d{13}3$/.test(cv);$('cVat').classList.toggle('invalid',cv.length>0&&!cvOk);S('cN',v('cName'));S('cV',cvOk?cv:'');S('cA',v('cAddr'));S('cNt',v('iNotes'));
let g=0,h='',n=0;
const RW=(c,nm,u,q,p,t)=>'<div class="r"><svg class="a" style="left:0;top:0;width:596px;height:18px;pointer-events:none;overflow:visible" viewBox="0 0 596 18"><path d="M25.44 18H577.51M25.44 0V18M109.45 0V18M180.74 0V18M245.07 0V18M285.88 0V18M526.63 0V18M577.51 0V18" stroke="#000" stroke-width="0.48" fill="none"/></svg><i class="c6">'+t+'</i><i class="c5">'+p+'</i><i class="c4">'+q+'</i><i class="c3">'+u+'</i><i class="c2">'+nm+'</i><i class="c1">'+c+'</i></div>';
rows.forEach(r=>{if(!r.ok)return;const q=parseFloat(r.q)||0,p=parseFloat(r.p)||0,t=r2(q*p);g+=t;n++;h+=RW(esc(r.c||''),esc(r.n||''),esc(r.u||''),f2(q),f2(p),f2(t))});
if(!n)h=RW('','','','','','');
$('pRows').innerHTML=h;$('low').style.top=(345.79+18*Math.max(n,1))+'px';
g=r2(g);const d=Math.max(0,parseFloat(v('iDisc'))||0),net=r2(g-d),rt=15,vt=r2(net*rt/100),tot=r2(net+vt);
S('tG',f2(g));S('tD',f2(d));S('tN',f2(net));$('tVl').innerHTML='قيمة الضريبة'+rt+'<span style="font-weight:400;display:inline-block;margin-right:0.67px;position:relative;top:-0.24px">%</span>';S('tV',f2(vt));S('tT',f2(tot));S('pW',tot>0?words(tot):'');
const dt=v('iDate'),tm=v('iTime'),tf=tm?(tm.length==5?tm+':00':tm):'00:00:00';let q='';
if(dt&&tot>0)q=b64(ORG,VAT,dt+'T'+tf+'Z',tot.toFixed(2),vt.toFixed(2));
if(q!==lastQ){lastQ=q;const e=$('pQr');e.innerHTML='';if(q)new QRCode(e,{text:q,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else e.innerHTML='<div class="p-qx">QR</div>'}
fit()}

$('invForm').addEventListener('input',e=>{const t=e.target;if(t.id){if(t.id!='cVat'&&t.value.trim())t.classList.remove('invalid');calc()}else if((t.dataset.k=='q'||t.dataset.k=='p')&&parseFloat(t.value)>0)t.classList.remove('bad')});
$('bPrint').onclick=()=>{const v=id=>$(id).value.trim(),cvOk=/^3\d{13}3$/.test(v('cVat'));let ok=true;['iNo','iDate','iTime','cName','cAddr'].forEach(id=>{const b=!v(id);$(id).classList.toggle('invalid',b);if(b)ok=false});$('cVat').classList.toggle('invalid',!cvOk);if(!cvOk)ok=false;[...$('items').children].forEach((el,i)=>{const r=rows[i]||{},cOk=!!r.ok,qOk=parseFloat(r.q)>0,pOk=parseFloat(r.p)>0;el.querySelector('[data-k=c]').classList.toggle('bad',!cOk);el.querySelector('[data-k=q]').classList.toggle('bad',!qOk);el.querySelector('[data-k=p]').classList.toggle('bad',!pOk);if(!cOk||!qOk||!pOk)ok=false});const dv=v('iDisc'),g=r2(rows.reduce((a,r)=>a+(r.ok?r2((parseFloat(r.q)||0)*(parseFloat(r.p)||0)):0),0)),dBad=dv!==''&&(!(parseFloat(dv)>=0)||parseFloat(dv)>=g);$('iDisc').classList.toggle('invalid',dBad);if(dBad)ok=false;if(!ok){const f=$('invForm').querySelector('.invalid,.bad');if(f)f.focus();return}window.print()};
$('bNew').onclick=()=>{['iNo','iDate','iTime','iNotes','cName','cVat','cAddr','iDisc'].forEach(i=>{$(i).value='';$(i).classList.remove('invalid')});rows=[{}];drawRows();calc()};
/* التنقل بين التبويبين (بدون أي مزامنة: رمز QR مستقل تمامًا عن الفاتورة) */
function route(){
const inv=location.hash=='#invoice';
document.body.classList.toggle('on-inv',inv);$('tInv').classList.toggle('on',inv);$('tQr').classList.toggle('on',!inv);
if(inv)calc()}
addEventListener('hashchange',route);addEventListener('resize',fit);
drawRows();route();calc();
})();
</script>
